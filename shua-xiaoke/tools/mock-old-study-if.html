<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>old-study-frame</title>
<style>
  body{font:14px/1.6 system-ui,"Microsoft YaHei";padding:12px;margin:0}
  .TiMu{border:1px solid #eee;border-radius:6px;padding:10px;margin:10px 0}
  .mark_letter li{display:inline-block;margin-right:16px}
</style></head>
<body>
<div class="TiMu"><div class="Zy_TItle">28 【判断题】一个文字即是简单析取式,又是简单合取式( &nbsp;)。</div>
  <ul class="mark_letter colorDeep">
    <li><label><input type="radio" name="a28" value="true"> A 对</label></li>
    <li><label><input type="radio" name="a28" value="false"> B 错</label></li>
  </ul>
</div>
<div class="TiMu"><div class="Zy_TItle">29 【判断题】任一命题公式都存在唯一与之等值的析取范式与合取范式( &nbsp;)。</div>
  <ul class="mark_letter colorDeep">
    <li><label><input type="radio" name="a29" value="true"> A 对</label></li>
    <li><label><input type="radio" name="a29" value="false"> B 错</label></li>
  </ul>
</div>
<div class="ZY_sub clearfix">
  <a class="btnSave" href="javascript:void(0);"><span>暂时保存</span></a>
  <a class="btnSubmit workBtnIndex" href="javascript:void(0);" role="button" onclick="window.__innerSubmit=(window.__innerSubmit||0)+1"><span title="提交">提交</span></a>
</div>
<script>
  // answered=1 时预先选中,模拟「已经全部答完」;answered=0 模拟留空题
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('answered') === '1') {
      document.querySelectorAll('.TiMu').forEach(function (t) {
        var r = t.querySelector('input[type=radio]');
        if (r) r.checked = true;
      });
    }
  } catch (e) {}
</script>
</body></html>
